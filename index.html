<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d35c5">
<title>FollowScope</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172033;background:#f7f5ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,#ede9fe,#f8fafc 42%,#ecfeff);padding-bottom:84px}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px max(18px,calc((100% - 1080px)/2));background:#ffffffd8;backdrop-filter:blur(16px);border-bottom:1px solid #fff}.brand{display:flex;gap:11px;align-items:center}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#7c3aed,#22d3ee);font-size:22px}.brand b,.brand small{display:block}.brand small{font-size:11px;color:#718096}.icon{border:1px solid #e8e8ee;background:#fff;border-radius:13px;padding:10px;color:#536070}main{max-width:1080px;margin:auto;padding:28px 18px}.hero{display:grid;gap:18px}.hero-main{padding:28px;border-radius:30px;color:white;background:linear-gradient(135deg,#101827,#3b1768,#101827);box-shadow:0 22px 50px #4c1d9533}.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.02;margin:18px 0 12px}.hero p{color:#d8d9e5;line-height:1.65}.tag{display:inline-flex;padding:7px 10px;border-radius:999px;background:#eafafb;color:#11717b;font-size:12px;font-weight:750}.primary{border:0;border-radius:16px;padding:13px 18px;color:#fff;font-weight:750;display:inline-flex;gap:8px;justify-content:center;align-items:center;background:linear-gradient(90deg,#7c3aed,#d946ef,#22d3ee);box-shadow:0 10px 24px #7c3aed35}.wide{width:100%}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats div{background:#ffffffdf;border:1px solid white;border-radius:22px;padding:20px}.stats b,.stats small{display:block}.stats b{font-size:28px}.stats small{color:#718096}.section-title{margin:30px 0 14px}.section-title h2{margin:0}.section-title p,.sub{color:#718096;margin:5px 0 20px}.search{margin-bottom:18px}.search input,.modal input{width:100%;height:48px;border:1px solid #e7e7ef;border-radius:16px;background:#fff;padding:0 15px;outline:none}.cards,.list,.info-grid{display:grid;gap:15px}.card,.row,.history,.info{background:#ffffffdf;border:1px solid #fff;border-radius:25px;padding:18px;box-shadow:0 5px 18px #22304a0a}.profile{display:flex;gap:12px;align-items:center}.profile-info{flex:1;min-width:0}.profile-info b,.profile-info a{display:block}.profile-info a,.row a{color:#6d36c6;text-decoration:none;font-weight:700}.avatar{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;font-weight:800;color:#6d36c6;background:linear-gradient(135deg,#ede9fe,#cffafe)}.delete{border:0;background:none;color:#b2bac6;font-size:20px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0}.mini span{text-align:center;background:#f7f8fb;border-radius:13px;padding:9px 3px;font-size:10px;color:#718096}.mini b{display:block;color:#172033;font-size:16px}.last{font-size:12px;color:#718096}.empty{grid-column:1/-1;padding:45px 20px;text-align:center;color:#718096;border:1px dashed #b9c1cf;border-radius:25px;background:#ffffff75}.row{display:flex;align-items:center;gap:12px}.badge{width:42px;height:42px;border-radius:15px;display:grid;place-items:center}.good{color:#07875b;background:#e9fbf3}.bad{color:#d64562;background:#fff0f3}.grow{flex:1}.grow small,.history small{display:block;color:#718096}.history p{margin:16px 0 5px}.history>.tag{float:right}.info span{display:grid;place-items:center;width:43px;height:43px;border-radius:15px;color:#6d36c6;background:#ede9fe;margin-bottom:14px}.info p{color:#718096;line-height:1.55}.warning,.hint{margin:18px 0;padding:15px;border-radius:17px;background:#fff6da;color:#7b5b00;line-height:1.55}nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:flex;padding:8px 6px max(8px,env(safe-area-inset-bottom));background:#ffffffeb;border-top:1px solid #fff;backdrop-filter:blur(15px)}nav button{flex:1;border:0;background:none;color:#9aa4b2;border-radius:15px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button.active{color:#6d36c6;background:#ede9fe}nav small{font-size:10px}.backdrop{position:fixed;inset:0;z-index:50;background:#11182760;backdrop-filter:blur(5px);display:flex;align-items:flex-end}.modal{width:100%;max-height:92vh;overflow:auto;background:#fff;padding:22px;border-radius:30px 30px 0 0}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal h2{margin:0}.modal label{display:block;font-size:13px;font-weight:750;margin:16px 0 7px}.upload{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px dashed #c9b7f2;background:#faf8ff;border-radius:18px;padding:14px;margin-top:12px}.upload>span{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#fff;color:#6d36c6}.upload div{flex:1;min-width:0}.upload b,.upload small{display:block}.upload small{color:#718096;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.upload em{font-style:normal;background:#e9fbf3;color:#07875b;border-radius:99px;padding:5px 8px}.toast{position:fixed;z-index:80;bottom:92px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;padding:13px;border-radius:16px;background:#101827;color:#fff;text-align:center;box-shadow:0 15px 35px #0004}@media(min-width:720px){body{padding-bottom:20px}.hero{grid-template-columns:1.25fr .75fr}.cards{grid-template-columns:repeat(2,1fr)}.info-grid{grid-template-columns:1fr 1fr}nav{position:sticky;bottom:16px;max-width:580px;margin:30px auto;border:1px solid #fff;border-radius:22px}.modal{max-width:520px;margin:auto;border-radius:30px}.backdrop{align-items:center}}@media(min-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div class="brand"><span class="logo">◎</span><div><b>FollowScope</b><small>локальные сравнения</small></div></div><button id="backup" class="icon" title="Скачать резервную копию">⇩</button></header>
<main id="main"></main>
<nav id="nav"><button data-tab="profiles" class="active">◎<small>Профили</small></button><button data-tab="changes">＋<small>Изменения</small></button><button data-tab="history">◷<small>История</small></button><button data-tab="privacy">盾<small>Безопасность</small></button></nav>
<div id="modal" class="backdrop hidden"><div class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal" class="icon">×</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='followscope_single_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"profiles":[]}'),tab='profiles',active=null,draft={followers:[],following:[],ff:'',fg:''};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2);const clean=v=>String(v||'').trim().replace(/^@/,'').replace(/\/$/,'').toLowerCase();const uniq=a=>[...new Set(a.map(clean).filter(Boolean))].sort();const fmt=x=>x?new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(x)):'Ещё не было';const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3000)}
function walk(n,o=[]){if(!n)return o;if(Array.isArray(n)){n.forEach(x=>walk(x,o));return o}if(typeof n==='object'){if(Array.isArray(n.string_list_data))n.string_list_data.forEach(x=>{let v=x?.value||(x?.href||'').match(/instagram\.com\/([^/?#]+)/i)?.[1];if(v)o.push(v)});Object.values(n).forEach(x=>walk(x,o))}return o}
function parseCSV(t){let l=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!l.length)return[];let S=x=>x.split(/[,;\t]/).map(y=>y.trim().replace(/^["']|["']$/g,'')),h=S(l[0]),i=h.findIndex(x=>/^(username|user|handle|account|value|имя пользователя)$/i.test(x));return uniq(l.slice(i>=0?1:0).map(x=>S(x)[i>=0?i:0]))}
async function parseFile(f){let t=await f.text();if(/\.(csv|txt)$/i.test(f.name))return parseCSV(t);let d=JSON.parse(t),v=uniq(walk(d));if(v.length)return v;if(Array.isArray(d))return uniq(d.map(x=>typeof x==='string'?x:x?.username||x?.handle||x?.value));for(let k of['followers','following','accounts','users','items'])if(Array.isArray(d?.[k]))return uniq(d[k].map(x=>typeof x==='string'?x:x?.username||x?.handle||x?.value));return[]}
function allChanges(){return data.profiles.flatMap(p=>(p.changes||[]).map(c=>({...c,profile:p}))).sort((a,b)=>new Date(b.detectedAt)-new Date(a.detectedAt))}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let m=$('#main'),c=allChanges();if(tab==='profiles'){m.innerHTML=`<section class="hero"><div class="hero-main"><span class="tag">Безопасный однофайловый прототип</span><h1>Замечай изменения между проверками.</h1><p>Добавь профиль, импортируй текущие JSON/CSV-списки и сравнивай их с последним снимком. Никаких паролей и фоновых запросов.</p><button class="primary" id="addProfile">＋ Добавить профиль</button></div><div class="stats"><div><b>${data.profiles.length}</b><small>Профилей</small></div><div><b>${data.profiles.reduce((s,x)=>s+x.snapshots.length,0)}</b><small>Снимков</small></div><div><b>${c.length}</b><small>Изменений</small></div><div><b>${c.filter(x=>x.type.endsWith('added')).length}</b><small>Добавлений</small></div></div></section><div class="section-title"><h2>Отслеживаемые профили</h2><p>Синхронизация запускается только вручную.</p></div><div class="search"><input id="search" placeholder="Найти профиль"></div><div class="cards" id="cards"></div>`;$('#addProfile').onclick=openAdd;$('#search').oninput=e=>renderCards(e.target.value);renderCards('')}else if(tab==='changes'){m.innerHTML=`<section><h1>Изменения</h1><p class="sub">Разница между соседними снимками.</p><div class="list">${c.length?c.map(x=>`<div class="row"><div class="badge ${x.type.endsWith('added')?'good':'bad'}">${x.type.endsWith('added')?'＋':'−'}</div><div class="grow"><a target="_blank" href="https://www.instagram.com/${encodeURIComponent(x.username)}/">@${esc(x.username)}</a><small>у @${esc(x.profile.username)} · ${x.type.startsWith('following')?'подписки':'подписчики'}</small></div><span class="tag">${x.type.endsWith('added')?'Добавлен':'Удалён'}</span></div>`).join(''):'<div class="empty">Изменения появятся после второй синхронизации.</div>'}</div></section>`}else if(tab==='history'){let h=data.profiles.flatMap(p=>p.snapshots.map((s,i)=>({p,s,i}))).sort((a,b)=>new Date(b.s.createdAt)-new Date(a.s.createdAt));m.innerHTML=`<section><h1>История</h1><p class="sub">Каждый импорт сохраняется отдельным снимком.</p><div class="list">${h.length?h.map(({p,s,i})=>`<div class="history"><span class="tag">${i?'Снимок '+(i+1):'Базовый'}</span><b>${esc(p.name)}</b><small>@${esc(p.username)}</small><p>${s.followers.length} подписчиков · ${s.following.length} подписок</p><small>${fmt(s.createdAt)}</small></div>`).join(''):'<div class="empty">История пока пуста.</div>'}</div></section>`}else{m.innerHTML=`<section><h1>Безопасность</h1><p class="sub">Только ручной импорт и локальное хранение.</p><div class="info-grid"><div class="info"><span>⌂</span><b>Локально</b><p>Данные хранятся в браузере этого устройства.</p></div><div class="info"><span>⇧</span><b>Ручной импорт</b><p>Приложение читает только выбранные JSON, CSV или TXT.</p></div><div class="info"><span>◫</span><b>Без логина</b><p>Пароль, cookies и токены Instagram не используются.</p></div><div class="info"><span>⇩</span><b>Резервная копия</b><p>Кнопка сверху экспортирует историю в JSON.</p></div></div><div class="warning">Импортируй только данные, которые ты вправе использовать. Приложение не извлекает списки из Instagram самостоятельно.</div></section>`}}
function renderCards(q){let ps=data.profiles.filter(x=>(x.name+' '+x.username).toLowerCase().includes(q.toLowerCase()));$('#cards').innerHTML=ps.length?ps.map(x=>`<article class="card"><div class="profile"><div class="avatar">${esc(x.name[0]?.toUpperCase()||'?')}</div><div class="profile-info"><b>${esc(x.name)}</b><a target="_blank" href="https://www.instagram.com/${encodeURIComponent(x.username)}/">@${esc(x.username)} ↗</a></div><button class="delete" data-del="${x.id}">×</button></div><div class="mini"><span><b>${x.snapshots.at(-1)?.followers.length||0}</b>подписчиков</span><span><b>${x.snapshots.at(-1)?.following.length||0}</b>подписок</span><span><b>${x.changes.length}</b>изменений</span></div><p class="last">Последняя проверка: <b>${fmt(x.lastSyncAt)}</b></p><button class="primary wide" data-sync="${x.id}">↻ Search now</button></article>`).join(''):'<div class="empty">Добавь первый профиль, затем создай базовый снимок.</div>';document.querySelectorAll('[data-sync]').forEach(b=>b.onclick=()=>openSync(b.dataset.sync));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Удалить профиль и его историю?')){data.profiles=data.profiles.filter(x=>x.id!==b.dataset.del);save();render()}})}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden')};function closeModal(){$('#modal').classList.add('hidden')}
function openAdd(){openModal('Добавить профиль',`<label>Instagram username</label><input id="username" placeholder="например, marina"><label>Название для себя</label><input id="name" placeholder="например, Марина"><button class="primary wide" id="saveProfile">＋ Добавить</button>`);$('#saveProfile').onclick=()=>{let u=clean($('#username').value);if(!u)return toast('Укажи username');if(data.profiles.some(x=>x.username===u))return toast('Профиль уже добавлен');data.profiles.push({id:uid(),username:u,name:$('#name').value.trim()||'@'+u,snapshots:[],changes:[],lastSyncAt:null});save();closeModal();render()}}
function openSync(id){active=id;draft={followers:[],following:[],ff:'',fg:''};let p=data.profiles.find(x=>x.id===id);openModal('Search now · @'+p.username,`<div class="hint">${p.snapshots.length?'Новые файлы будут сравнены с последним снимком.':'Первая проверка станет базовым снимком и не создаст ложных изменений.'}</div><button class="upload" id="followersBtn"><span>⇧</span><div><b>Подписчики</b><small id="followersName">Выберите JSON, CSV или TXT</small></div><em id="followersCount" class="hidden"></em></button><input id="followersFile" type="file" hidden accept=".json,.csv,.txt"><button class="upload" id="followingBtn"><span>⇧</span><div><b>Подписки</b><small id="followingName">Выберите JSON, CSV или TXT</small></div><em id="followingCount" class="hidden"></em></button><input id="followingFile" type="file" hidden accept=".json,.csv,.txt"><button class="primary wide" id="compare">⌕ Сравнить</button>`);setupFile('followers');setupFile('following');$('#compare').onclick=sync}
function setupFile(type){$('#'+type+'Btn').onclick=()=>$('#'+type+'File').click();$('#'+type+'File').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let l=await parseFile(f);if(!l.length)throw 0;draft[type]=l;draft[type==='followers'?'ff':'fg']=f.name;$('#'+type+'Name').textContent=f.name;let c=$('#'+type+'Count');c.textContent=l.length;c.classList.remove('hidden')}catch{toast('Не удалось прочитать файл')}}}
function sync(){let p=data.profiles.find(x=>x.id===active);if(!draft.followers.length&&!draft.following.length)return toast('Добавь хотя бы один файл');let at=new Date().toISOString(),prev=p.snapshots.at(-1),followers=draft.followers.length?uniq(draft.followers):(prev?.followers||[]),following=draft.following.length?uniq(draft.following):(prev?.following||[]),ch=!prev?[]:[...followers.filter(v=>!prev.followers.includes(v)).map(username=>({id:uid(),username,type:'follower_added',detectedAt:at})),...prev.followers.filter(v=>!followers.includes(v)).map(username=>({id:uid(),username,type:'follower_removed',detectedAt:at})),...following.filter(v=>!prev.following.includes(v)).map(username=>({id:uid(),username,type:'following_added',detectedAt:at})),...prev.following.filter(v=>!following.includes(v)).map(username=>({id:uid(),username,type:'following_removed',detectedAt:at}))];p.lastSyncAt=at;p.snapshots.push({id:uid(),createdAt:at,followers,following});p.changes=[...ch,...p.changes];save();closeModal();render();toast(prev?'Сравнение завершено':'Базовый снимок сохранён')}
$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('#nav').onclick=e=>{let b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;render()}};$('#backup').onclick=()=>{let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='followscope-backup.json';a.click();URL.revokeObjectURL(u)};render();
</script>
</body>
</html>
